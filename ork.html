        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTech | Visionary Future</title>
    
    <!-- Google Fonts for that 'Exclusive' Tech Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <style>
        /* CSS VARIABLES - Easy to change colors here */
        :root {
            --bg-color: #050505;        /* Deep Obsidian */
            --accent-color: #00ffcc;    /* Surgical Teal */
            --text-main: #ffffff;       /* Pure White */
            --text-dim: #888888;        /* Muted Grey */
            --glow: rgba(0, 255, 204, 0.15);
        }

        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* NAVIGATION */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(5,5,5,1), rgba(5,5,5,0));
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .nav-links span {
            margin-left: 40px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-dim);
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-links span:hover {
            color: var(--accent-color);
        }

        /* HERO SECTION (SECTION 1) */
        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 0 20px;
            /* Subtle radial glow in the center */
            background: radial-gradient(circle at center, #0e161d 0%, var(--bg-color) 80%);
        }

        .hero-content {
            text-align: center;
            max-width: 1100px;
        }

        .tagline {
            font-size: 0.85rem;
            letter-spacing: 6px;
            color: var(--accent-color);
            text-transform: uppercase;
            margin-bottom: 24px;
            display: block;
            font-weight: 400;
        }

        .motto {
            font-family: 'Syne', sans-serif;
            font-size: clamp(3rem, 8vw, 6.5rem); /* Responsive font size */
            line-height: 1;
            font-weight: 800;
            margin-bottom: 40px;
            background: linear-gradient(to bottom, #ffffff 40%, #444444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-info {
            font-size: 1.1rem;
            color: var(--text-dim);
            max-width: 550px;
            margin: 0 auto;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* BUTTONS */
        .cta-container {
            margin-top: 50px;
        }

        .btn-primary {
            background: none;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 15px 35px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            background: var(--text-main);
            color: var(--bg-color);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        /* SCROLL INDICATOR */
        .scroll-hint {
            position: absolute;
            bottom: 40px;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .line {
            width: 1px;
            height: 50px;
            background: linear-gradient(to bottom, #333, transparent);
            margin-top: 10px;
        }

        /* RESPONSIVE ADJUSTMENTS */
        @media (max-width: 768px) {
            nav { padding: 20px; }
            .nav-links { display: none; } /* Hide menu on mobile for now */
            .motto { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">MED-TECH-X</div>
        <div class="nav-links">
            <span>Vision</span>
            <span>Tech</span>
            <span>Clinical</span>
            <span>Contact</span>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <span class="tagline">The New Frontier of Health</span>
            
            <!-- Your Company Motto -->
            <h1 class="motto">Where Passion <br> Meets Precision.</h1>
            
            <p class="sub-info">
                We are building a future where medical technology is as intuitive 
                as life itself. Join us in our journey to redefine care.
            </p>

            <div class="cta-container">
                <button class="btn-primary">Explore our Mission</button>
            </div>
        </div>

        <div class="scroll-hint">
            Scroll to Explore
            <div class="line"></div>
        </div>
    </section>

    <!-- 
       Note: We will add Section 2 (The Mission) 
       directly under this Hero section next! 
    -->

</body>
</html>
